name: Build Mahadev Traders APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Ensure debug keystore exists
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1:|SHA256:" || true

      - name: Ensure google-services.json exists
        env:
          GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_CONTENT" ]; then
            printf '%s' "$GOOGLE_SERVICES_CONTENT" > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json is missing! Firebase will show setup instructions in the APK."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Rename APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk MahadevTraders.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MahadevTraders-APK
          path: MahadevTraders.apk
          retention-days: 90

      - name: Publish Direct Download Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA1=$(keytool -list -v -keystore debug.keystore -storepass android | grep -m1 "SHA1:" | sed 's/.*SHA1:[[:space:]]*//')
          SHA256=$(keytool -list -v -keystore debug.keystore -storepass android | grep -m1 "SHA256:" | sed 's/.*SHA256:[[:space:]]*//')
          TAG="latest-apk"
          gh release delete "$TAG" --yes >/dev/null 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG"
          gh release create "$TAG" MahadevTraders.apk \
            --title "Mahadev Traders App (Latest APK)" \
            --notes "મહાદેવ ટ્રેડર્સ Android APK ડાઉનલોડ કરવા માટે નીચે આપેલ MahadevTraders.apk પર ક્લિક કરો.

          APK Signing Fingerprints (જો Google Sign-In માટે Firebase Console માં ઉમેરવું પડે):
          SHA-1: $SHA1
          SHA-256: $SHA256" \
            --latest
